<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Qualification Expert System</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1d2433; --muted: #5d6679;
    --accent: #2f5bea; --ok: #1f8a4c; --ok-bg: #e7f6ed; --bad: #c0392b; --bad-bg: #fdecea;
    --warn-bg: #fff6e0; --border: #dde2ec;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .progress { height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); transition: width .25s; }
  .qnum { color: var(--muted); font-size: .9rem; }
  .question { font-size: 1.25rem; font-weight: 600; margin: 4px 0 8px; }
  .hint { color: var(--muted); font-size: .95rem; margin-bottom: 16px; }
  input[type=text] { width: 100%; font-size: 1.1rem; padding: 10px 12px; border: 2px solid var(--border);
                     border-radius: 8px; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  input.invalid { border-color: var(--bad); }
  .error { color: var(--bad); background: var(--bad-bg); border-radius: 8px; padding: 10px 12px;
           margin-top: 12px; display: none; }
  .buttons { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  button { font-size: 1rem; padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border);
           background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  h2 { font-size: 1.2rem; margin: 28px 0 12px; }
  .pos { border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; border: 1px solid; }
  .pos.ok { background: var(--ok-bg); border-color: #b9e3c8; }
  .pos.bad { background: var(--bad-bg); border-color: #f3c1bb; }
  .pos h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .pos ul { margin: 6px 0 0; padding-left: 20px; }
  .pass { color: var(--ok); } .fail { color: var(--bad); }
  .note { background: var(--warn-bg); border-radius: 6px; padding: 6px 10px; margin-top: 8px; font-size: .92rem; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td:first-child { color: var(--muted); width: 60%; }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--accent); }
  .trace { font-family: ui-monospace, Menlo, monospace; font-size: .85rem; white-space: pre-wrap;
           background: #f0f2f7; padding: 12px; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1>Job Qualification Expert System</h1>
  <p class="sub">Answer each question to see which positions you qualify for.</p>
  <div id="app" class="card"></div>
</main>

<script>
/* =====================================================================
   KNOWLEDGE BASE
   ===================================================================== */

// Degree levels in rank order. A higher degree also satisfies a lower one
// (e.g. a Masters in Computer Science satisfies "Bachelor in CS").
const DEGREE_RANK = { None: 0, Associates: 1, Bachelors: 2, Masters: 3, Doctorate: 4 };

// Questions asked to the applicant. Each maps to one fact in working memory.
const QUESTIONS = [
  { id: 'degreeLevel', type: 'degree',
    text: 'What is the highest degree you have completed?',
    hint: 'Type exactly one of: None, Associates, Bachelors, Masters, Doctorate' },
  { id: 'degreeField', type: 'field',
    text: 'What is the field of study of that degree?',
    hint: 'Type the full name of the field, e.g. "Computer Science" (abbreviations such as "CS" are not accepted).',
    skipIf: f => f.degreeLevel === 'None' },
  { id: 'pythonCourse', type: 'yesno',
    text: 'Have you completed Python course work?', hint: 'Type Yes or No' },
  { id: 'seCourse', type: 'yesno',
    text: 'Have you completed Software Engineering course work?', hint: 'Type Yes or No' },
  { id: 'agileCourse', type: 'yesno',
    text: 'Have you completed an Agile course?', hint: 'Type Yes or No' },
  { id: 'pythonYears', type: 'years',
    text: 'How many years of Python development experience do you have?', hint: 'Enter a number, e.g. 0, 2, or 3.5' },
  { id: 'dataDevYears', type: 'years',
    text: 'How many years of data development experience do you have?', hint: 'Enter a number, e.g. 0, 2, or 3.5' },
  { id: 'dataArchYears', type: 'years',
    text: 'How many years of data architecture experience do you have?', hint: 'Enter a number, e.g. 0, 2, or 3.5' },
  { id: 'expertSysYears', type: 'years',
    text: 'How many years of experience developing Expert Systems do you have?', hint: 'Enter a number, e.g. 0, 2, or 3.5' },
  { id: 'agileYears', type: 'years',
    text: 'How many years of experience working on Agile projects do you have?', hint: 'Enter a number, e.g. 0, 2, or 3.5' },
  { id: 'pmYears', type: 'years',
    text: 'How many years of experience managing software projects do you have?', hint: 'Enter a number, e.g. 0, 2, or 3.5' },
  { id: 'usedGit', type: 'yesno',
    text: 'Have you used Git?', hint: 'Type Yes or No' },
  { id: 'pmiLean', type: 'yesno',
    text: 'Do you hold the PMI Lean Project Management Certification?', hint: 'Type Yes or No' },
];

// Readable labels for the answer summary.
const LABELS = {
  degreeLevel: 'Highest degree', degreeField: 'Field of study', pythonCourse: 'Python course work',
  seCourse: 'Software Engineering course work', agileCourse: 'Agile course',
  pythonYears: 'Years of Python development', dataDevYears: 'Years of data development',
  dataArchYears: 'Years of data architecture', expertSysYears: 'Years developing Expert Systems',
  agileYears: 'Years on Agile projects', pmYears: 'Years managing software projects',
  usedGit: 'Used Git', pmiLean: 'PMI Lean PM Certification',
};

// Condition helpers. Each condition knows how to test working memory
// and how to explain itself when it passes or fails.
const is = (fact, value, desc) => ({
  desc, test: f => f[fact] === value,
  why: f => `${desc}: you answered "${f[fact] ?? 'N/A'}".`,
});
const atLeast = (fact, n, desc) => ({
  desc, test: f => f[fact] >= n,
  why: f => `${desc}: you have ${f[fact]} year(s).`,
});
const holds = (fact, desc, whyFail) => ({
  desc, test: f => f[fact] === true, why: whyFail,
});

const degreeText = f => f.degreeLevel === 'None'
  ? 'you entered no degree'
  : `you have a ${f.degreeLevel} in ${f.degreeField}`;

// Derivation rules (forward-chained): produce intermediate facts from answers.
const DERIVATION_RULES = [
  { name: 'R1 Bachelor-in-CS',
    if: [ { test: f => f.degreeField === 'Computer Science' },
          { test: f => DEGREE_RANK[f.degreeLevel] >= DEGREE_RANK.Bachelors } ],
    then: 'hasBachelorCS' },
  { name: 'R2 Masters-in-CS',
    if: [ { test: f => f.degreeField === 'Computer Science' },
          { test: f => DEGREE_RANK[f.degreeLevel] >= DEGREE_RANK.Masters } ],
    then: 'hasMastersCS' },
];

// Position rules. "required" = needed skills + qualifications (all must hold).
// "desired" = nice-to-have; reported but they never disqualify.
const POSITIONS = [
  { name: 'Entry-Level Python Engineer',
    required: [
      is('pythonCourse', 'Yes', 'Requires Python course work'),
      is('seCourse', 'Yes', 'Requires Software Engineering course work'),
      holds('hasBachelorCS', 'Requires a Bachelors in Computer Science',
            f => `Requires a Bachelors in Computer Science: ${degreeText(f)}.`),
    ],
    desired: [ is('agileCourse', 'Yes', 'Agile course') ] },

  { name: 'Python Engineer',
    required: [
      atLeast('pythonYears', 3, 'Requires at least 3 years of Python development'),
      atLeast('dataDevYears', 1, 'Requires at least 1 year of data development'),
      holds('hasBachelorCS', 'Requires a Bachelors in Computer Science',
            f => `Requires a Bachelors in Computer Science: ${degreeText(f)}.`),
    ],
    desired: [
      { desc: 'Experience in Agile projects', test: f => f.agileYears > 0 },
      is('usedGit', 'Yes', 'Used Git'),
    ] },

  { name: 'Project Manager',
    required: [
      atLeast('pmYears', 3, 'Requires at least 3 years managing software projects'),
      atLeast('agileYears', 2, 'Requires at least 2 years of experience in Agile projects'),
      is('pmiLean', 'Yes', 'Requires the PMI Lean Project Management Certification'),
    ],
    desired: [] },

  { name: 'Senior Knowledge Engineer',
    required: [
      atLeast('pythonYears', 4, 'Requires at least 4 years using Python to develop'),
      atLeast('expertSysYears', 2, 'Requires at least 2 years developing Expert Systems'),
      atLeast('dataArchYears', 2, 'Requires at least 2 years of data architecture'),
      atLeast('dataDevYears', 2, 'Requires at least 2 years of data development'),
      holds('hasMastersCS', 'Requires a Masters in Computer Science',
            f => `Requires a Masters in Computer Science: ${degreeText(f)}.`),
    ],
    desired: [] },
];

/* =====================================================================
   INFERENCE ENGINE (forward chaining)
   ===================================================================== */

function infer(answers) {
  const wm = { ...answers };         // working memory
  const trace = [];

  // 1. Forward-chain derivation rules until no new facts are added.
  let changed = true;
  while (changed) {
    changed = false;
    for (const rule of DERIVATION_RULES) {
      if (wm[rule.then] === undefined && rule.if.every(c => c.test(wm))) {
        wm[rule.then] = true;
        trace.push(`FIRED  ${rule.name}  =>  ${rule.then} = true`);
        changed = true;
      }
    }
  }
  for (const rule of DERIVATION_RULES) {
    if (wm[rule.then] === undefined) {
      wm[rule.then] = false;
      trace.push(`NOT FIRED  ${rule.name}  =>  ${rule.then} = false`);
    }
  }

  // 2. Evaluate each position rule against working memory.
  const results = POSITIONS.map(pos => {
    const failed = pos.required.filter(c => !c.test(wm));
    const met = pos.required.filter(c => c.test(wm));
    const desiredMet = pos.desired.filter(c => c.test(wm)).map(c => c.desc);
    const desiredMissing = pos.desired.filter(c => !c.test(wm)).map(c => c.desc);
    const qualified = failed.length === 0;
    trace.push(`${qualified ? 'FIRED' : 'NOT FIRED'}  Position rule "${pos.name}"` +
               (qualified ? '  =>  QUALIFIED' : `  (${failed.length} condition(s) failed)`));
    return {
      name: pos.name, qualified,
      reasons: failed.map(c => c.why(wm)),
      met: met.map(c => c.desc.replace(/^Requires /, '')),
      desiredMet, desiredMissing,
    };
  });

  return { results, trace };
}

/* =====================================================================
   INPUT VALIDATION
   Returns { value } on valid input, or { error } with guidance.
   ===================================================================== */

function validate(type, raw) {
  const s = raw.trim();
  if (s === '') return { error: 'Please enter an answer.' };
  const lower = s.toLowerCase().replace(/\s+/g, ' ');

  if (type === 'yesno') {
    if (lower === 'yes') return { value: 'Yes' };
    if (lower === 'no') return { value: 'No' };
    if (['y', 'yeah', 'yep', 'true', 'ok'].includes(lower))
      return { error: `"${s}" is not accepted. Please type the full word "Yes".` };
    if (['n', 'nope', 'nah', 'false'].includes(lower))
      return { error: `"${s}" is not accepted. Please type the full word "No".` };
    return { error: `"${s}" is not a valid answer. Please type "Yes" or "No".` };
  }

  if (type === 'years') {
    if (!/^\d+(\.\d+)?$/.test(s))
      return { error: `"${s}" is not valid. Enter the number of years using digits only (e.g. 3 or 2.5). Do not use words like "three" or negative numbers.` };
    const n = parseFloat(s);
    if (n > 60) return { error: `${n} years is not a realistic value. Please enter a number between 0 and 60.` };
    return { value: n };
  }

  if (type === 'degree') {
    for (const d of Object.keys(DEGREE_RANK))
      if (lower === d.toLowerCase()) return { value: d };
    const hints = [
      [/^(b\.?\s?s\.?|b\.?\s?a\.?|b\.?\s?sc\.?|bachelor|bachelor'?s|bachelors degree|bachelor'?s degree|bachelor of .*|undergrad.*)$/, 'Bachelors'],
      [/^(m\.?\s?s\.?|m\.?\s?a\.?|m\.?\s?sc\.?|master|master'?s|masters degree|master'?s degree|master of .*|graduate)$/, 'Masters'],
      [/^(ph\.?\s?d\.?|doctor|doctoral|doctorate degree|doctor of .*)$/, 'Doctorate'],
      [/^(a\.?\s?a\.?|a\.?\s?s\.?|associate|associate'?s|associates degree|associate'?s degree)$/, 'Associates'],
      [/^(none|no|n\/a|na|no degree|high school|hs|ged)$/, 'None'],
    ];
    for (const [re, correct] of hints)
      if (re.test(lower))
        return { error: `"${s}" is not in the accepted format. Please enter "${correct}".` };
    return { error: `"${s}" is not a recognized degree. Please enter exactly one of: None, Associates, Bachelors, Masters, Doctorate.` };
  }

  if (type === 'field') {
    if (lower === 'computer science') return { value: 'Computer Science' };
    if (/^(c\.?\s?s\.?|comp\.? ?sci\.?|compsci|cmpsc|cs degree|computer sci\.?|comp science|computer-science|computerscience)$/.test(lower))
      return { error: `"${s}" is an abbreviation. Please enter "Computer Science".` };
    if (!/^[a-z][a-z .&'-]{1,59}$/.test(lower))
      return { error: `"${s}" is not a valid field of study. Use letters only and spell out the full name (e.g. "Computer Science", "Mathematics").` };
    // Any other properly spelled-out field is accepted (title-cased).
    return { value: s.replace(/\s+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) };
  }
}

/* =====================================================================
   USER INTERFACE
   ===================================================================== */

const app = document.getElementById('app');
let answers = {};
let history = [];  // indices of questions asked, for the Back button
let current = 0;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function nextIndex(from) {
  for (let i = from + 1; i < QUESTIONS.length; i++)
    if (!QUESTIONS[i].skipIf || !QUESTIONS[i].skipIf(answers)) return i;
  return -1;
}

function renderQuestion() {
  const q = QUESTIONS[current];
  const shown = QUESTIONS.filter(x => !x.skipIf || !x.skipIf(answers));
  const pos = shown.indexOf(q) + 1;
  const prev = answers[q.id] !== undefined ? answers[q.id] : '';
  app.innerHTML = `
    <div class="progress"><div style="width:${(pos - 1) / shown.length * 100}%"></div></div>
    <div class="qnum">Question ${pos} of ${shown.length}</div>
    <div class="question">${esc(q.text)}</div>
    <div class="hint">${esc(q.hint)}</div>
    <input type="text" id="answer" autocomplete="off" value="${esc(prev)}" aria-describedby="err">
    <div class="error" id="err" role="alert"></div>
    <div class="buttons">
      <button id="back" ${history.length ? '' : 'disabled'}>Back</button>
      <button id="next" class="primary">${nextIndex(current) === -1 ? 'See results' : 'Next'}</button>
    </div>`;
  const input = document.getElementById('answer');
  input.focus();
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  document.getElementById('next').onclick = submit;
  document.getElementById('back').onclick = () => { current = history.pop(); renderQuestion(); };
}

function submit() {
  const q = QUESTIONS[current];
  const input = document.getElementById('answer');
  const err = document.getElementById('err');
  const r = validate(q.type, input.value);
  if (r.error) {
    err.textContent = r.error; err.style.display = 'block';
    input.classList.add('invalid'); input.focus();
    return;
  }
  answers[q.id] = r.value;
  if (q.id === 'degreeLevel' && r.value === 'None') answers.degreeField = 'N/A';
  const n = nextIndex(current);
  if (n === -1) return renderResults();
  history.push(current);
  current = n;
  renderQuestion();
}

function renderResults() {
  const { results, trace } = infer(answers);
  const ok = results.filter(r => r.qualified);
  const bad = results.filter(r => !r.qualified);

  const desiredNote = r => {
    if (!r.desiredMet.length && !r.desiredMissing.length) return '';
    let s = '';
    if (r.desiredMet.length) s += `Desired skills you have: ${r.desiredMet.join(', ')}. `;
    if (r.desiredMissing.length) s += `Desired skills you lack (not required): ${r.desiredMissing.join(', ')}.`;
    return `<div class="note">${esc(s)}</div>`;
  };

  app.innerHTML = `
    <div class="progress"><div style="width:100%"></div></div>
    <h2 style="margin-top:0">Positions you are qualified for</h2>
    ${ok.length ? ok.map(r => `
      <div class="pos ok"><h3 class="pass">✔ ${esc(r.name)}</h3>
        You meet all required conditions:
        <ul>${r.met.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
        ${desiredNote(r)}
      </div>`).join('') : '<p>You do not currently qualify for any available position.</p>'}

    <h2>Positions you are not qualified for</h2>
    ${bad.length ? bad.map(r => `
      <div class="pos bad"><h3 class="fail">✘ ${esc(r.name)}</h3>
        Disqualifying conditions:
        <ul>${r.reasons.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
        ${desiredNote(r)}
      </div>`).join('') : '<p>None. You qualify for every available position.</p>'}

    <details><summary>Your answers</summary>
      <table>${Object.keys(LABELS).map(k => `<tr><td>${LABELS[k]}</td><td>${esc(answers[k])}</td></tr>`).join('')}</table>
    </details>
    <details><summary>Inference trace (how the conclusion was reached)</summary>
      <div class="trace">${esc(trace.join('\n'))}</div>
    </details>
    <div class="buttons"><button class="primary" id="restart">Start over</button></div>`;
  document.getElementById('restart').onclick = () => {
    answers = {}; history = []; current = 0; renderQuestion();
  };
}

renderQuestion();
</script>
</body>
</html>
